spring:
  application:
    name: javaadvance

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/test_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:SECRET}

  hibernate:
    ddl-auto: none

  liquibase:
    enabled: true

  data:
    redis:
       host: ${REDIS_HOST:localhost}
       port: ${REDIS_PORT:6379}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

kind: Application




