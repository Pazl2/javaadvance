databaseChangeLog:
  - changeSet:
      id: create-indexes-users-table
      author: Pazl2
      changes:
        - createIndex:
            indexName: idx_users_email
            tableName: users
            columns:
              - column:
                  name: email

        - createIndex:
            indexName: idx_users_active
            tableName: users
            columns:
              - column:
                  name: active