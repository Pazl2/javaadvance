databaseChangeLog:
  - changeSet:
      id: create-users
      author: Pazl2
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: "pk_users"
              - column:
                  name: name
                  type: varchar(20)
                  defaultValue: "Incognito"
              - column:
                 name: surname
                 type: varchar(20)
                 defaultValue: "None"
              - column:
                  name: birth_date
                  type: date
                  constraints:
                    nullable: true
              - column:
                  name: email
                  type: varchar(40)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: active
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false




