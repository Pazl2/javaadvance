databaseChangeLog:
  - changeSet:
      id: create-indexes-payment-cards-table
      author: Pazl2
      changes:
        - createIndex:
            indexName: idx_payment_cards_user_id
            tableName: payment_cards
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_payment_cards_active
            tableName: payment_cards
            columns:
              - column:
                  name: active

        - createIndex:
            indexName: idx_payment_cards_number
            tableName: payment_cards
            columns:
              - column:
                  name: number

